name: Deploy Portfolio (Cloudflare Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'pages/**'
      - 'scripts/build-pages.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-portfolio
      cancel-in-progress: true

    env:
      PAGES_PROJECT: chadmurchison-portfolio

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Live site: Cloudflare Pages (chadmurchison.com + www, cut over Oct 25 2026).
      # dist/ = index.html + assets/ + pages/_headers, pages/_redirects, pages/robots.txt
      - name: Assemble Pages output
        run: ./scripts/build-pages.sh dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Deployed
        run: echo "✅ Deployed https://chadmurchison.com/ (Cloudflare Pages)"
